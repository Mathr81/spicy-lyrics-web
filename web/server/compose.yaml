# Run the proxy on a VPS or home server:
#
#   cd web/server
#   cp .env.example .env     # put your sp_dc cookie in it
#   docker compose up -d
#
# Then point the web app at it: build with
# VITE_LYRICS_API=https://lyrics.example.com (see web/README.md).
#
# One container, no dependencies, no database. The image is node:22-alpine plus
# three source files; at rest the proxy holds a session token and a few counters.
#
# NO PORT IS PUBLISHED ON THE HOST. The container joins the reverse proxy's own
# Docker network (Nginx Proxy Manager's `npm_default` by default) and is reached
# there by container name. Nothing about it is listening on the machine's
# interfaces, which is what you want for a service that talks to the Spotify API
# as your own account.
#
# In Nginx Proxy Manager → Proxy Hosts → Add:
#   Forward Hostname / IP:  spicy-lyrics-proxy
#   Forward Port:           8787
#   (+ request a TLS certificate — the page needs HTTPS, see web/README.md)

services:
  proxy:
    build: .
    image: spicy-lyrics-proxy
    container_name: spicy-lyrics-proxy
    restart: unless-stopped

    # Reachable only from the reverse proxy's network, on this port. `expose`
    # publishes nothing — it documents the port for whoever reads this file.
    expose:
      - "8787"

    # Not using a reverse proxy in Docker? Uncomment to publish the port on the
    # host instead, and keep the 127.0.0.1 — see the note at the top.
    #ports:
    #  - "127.0.0.1:8787:8787"

    networks:
      - reverse-proxy

    env_file: .env

    # The session and the lyric cache. Losing it costs one re-fetch per song,
    # nothing more, but keeping it means a restart is free.
    volumes:
      - state:/state

    # Nothing is written outside /state, so the rest of the filesystem can be
    # read-only — one less thing a compromised dependency could touch (there are
    # no dependencies, but the proxy does parse network input).
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Small by nature: idle it sits around 60-80 MB RSS. The limit is a
    # backstop against a leak eating a small VPS, not a tuning knob.
    mem_limit: 192m
    pids_limit: 128

    # Without this a long-running container's logs grow until the disk is full.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Nginx Proxy Manager's network, created by ITS compose file, not this one —
  # hence `external`. Override the name in .env if yours differs (Docker derives
  # it from the directory the reverse proxy's compose file lives in, so it is
  # `npm_default` for a stack in `npm/`, `nginx-proxy-manager_default` for one
  # in `nginx-proxy-manager/`, …). Check with: docker network ls
  reverse-proxy:
    name: ${PROXY_NETWORK:-npm_default}
    external: true

volumes:
  state:
